<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omamu Preview · RG35XX H</title>
<style>
:root{--amber:#e8a84a;--cream:#f4f0e8;--text:#c8c2b8;--muted:#8a8278}
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#eee;font:14px/1.45 system-ui,Segoe UI,sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,1fr) 260px;gap:20px;max-width:1120px;margin:auto;padding:22px}
h1{font-size:22px;margin:0 0 4px}p{color:#aaa49a;margin:0 0 16px}
.stage{display:flex;justify-content:center;background:#151515;padding:16px;border:1px solid #292929;border-radius:12px}
.screen{width:640px;max-width:100%;aspect-ratio:4/3;height:auto;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--text);font:14px/1.3 'JetBrains Mono',Consolas,monospace;background:#101010;box-shadow:0 8px 30px #0009;isolation:isolate}
.wallpaper{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.screen:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#101010a8 0%,#10101030 35%,#10101040 65%,#101010c9 100%);pointer-events:none}
.screen.no-wall .wallpaper{display:none}
@keyframes drift{0%{transform:scale(1.04) translateX(-.4%)}50%{transform:scale(1.08) translateX(.4%)}100%{transform:scale(1.04) translateX(-.4%)}}
.screen.animated .wallpaper{animation:drift 18s ease-in-out infinite alternate}
.header{height:40px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--cream);font-size:14px;padding:0 18px;text-shadow:0 1px 3px #000;white-space:nowrap}
.status{height:30px;flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 12px;color:var(--cream);font-size:12px;text-shadow:0 1px 3px #000}
.clock{text-align:center;color:var(--amber);font-size:14px}.right{display:flex;justify-content:flex-end;align-items:center;gap:8px;white-space:nowrap}
.wifi{width:20px;height:18px;vertical-align:middle}.battery{display:inline-flex;align-items:center;gap:3px}.battery svg{width:22px;height:13px}
.content{flex:1;min-height:0;padding:14px 18px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}
.row{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;padding:8px 4px;text-align:center;border:1px solid #51402a99;background:#101010d9;color:var(--text);text-shadow:0 1px 2px #000}
.glyph{font-family:system-ui,sans-serif;font-size:30px;line-height:1;color:var(--cream);text-shadow:0 1px 3px #000}
.label{font-size:13px;overflow-wrap:anywhere;max-height:2.6em;overflow:hidden}
.row.selected{background:#302719eF;border-color:var(--amber);color:#fff4df;box-shadow:inset 0 0 0 1px #e8a84a33}.row.selected .glyph{color:var(--amber)}
.footer{height:44px;flex:none;background:#101010e8;color:var(--text);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px;text-shadow:0 1px 2px #000}.key{color:var(--amber)}
.controls{background:#151515;border:1px solid #292929;border-radius:12px;padding:16px;height:max-content}.controls h2{font-size:15px;margin:0 0 12px}
.field{margin:0 0 14px}.field label{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;color:#d7d2c9}.field select{width:100%;background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:8px}
.check{display:flex;align-items:center;gap:8px;margin:10px 0;color:#d7d2c9}.hint{font-size:11px;color:#8f8a82;margin-top:12px}
@media(max-width:850px){.app{grid-template-columns:1fr;padding:12px}.stage{padding:6px}.controls{order:2}}
</style></head><body><div class="app"><main><h1>Omamu Preview</h1><p>Simulasi layar muOS RG35XX H · 640 × 480</p>
<div class="stage"><div class="screen animated" id="screen"><img class="wallpaper" alt="" src="https://raw.githubusercontent.com/insomdroid/Omamu/main/Pixel%20Planet%20Over%20a%20Misty%20Horizon.png">
<div class="header" id="title">Omamu · Main Menu</div>
<div class="status"><div><svg class="wifi" viewBox="0 0 24 20"><path d="M2 6.5Q12 -1 22 6.5M5.5 10Q12 4.5 18.5 10M9 13.5Q12 11 15 13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.5" fill="currentColor"/></svg> Wi-Fi</div><div class="clock">23:48</div><div class="right">BT <span class="battery">▰ 86%</span></div></div>
<div class="content" id="rows"></div><div class="footer"><span><span class="key">A</span> Select　 <span class="key">B</span> Back</span><span>OMAMU · muOS</span></div></div></div></main>
<aside class="controls"><h2>Live controls</h2>
<div class="field"><label for="wall">Wallpaper</label><select id="wall"><option value="image">Wallpaper repositori + animasi halus</option><option value="still">Wallpaper statis</option><option value="black">Hitam polos</option></select></div>
<div class="field"><label for="layout">Tata letak</label><select id="layout"><option value="grid">Grid 2 × 4</option><option value="list">Daftar</option></select></div>
<div class="field"><label for="view">Menu</label><select id="view"><option value="main">Main Menu</option><option value="explore">Explore Content</option><option value="settings">Configuration</option></select></div>
<label class="check"><input id="animation" type="checkbox" checked> Animasi wallpaper</label>
<div class="hint">Wallpaper dimuat langsung dari gambar di repositori GitHub. Simulasi ini bukan renderer asli muOS; gradasi gelap dibuat agar teks menu tetap terbaca.</div></aside></div>
<script>
const menus={main:[['⌕','Explore Content'],['▦','Collection'],['◷','History'],['▣','Applications'],['⚙','Configuration'],['ⓘ','Information'],['↻','Reboot'],['⏻','Shutdown']],explore:[['▣','Recent'],['▤','Library'],['⌕','Search Games'],['◫','Collections'],['⌂','Main Menu']],settings:[['◐','General Settings'],['⌁','Connectivity'],['▧','Customization'],['▣','Application Settings'],['⚙','Advanced Settings'],['↶','Back']]};
const $=id=>document.getElementById(id);
function draw(){let view=$('view').value,grid=$('layout').value==='grid'&&view==='main';$('title').textContent={main:'Omamu · Main Menu',explore:'Explore Content',settings:'Configuration'}[view];$('rows').style.display=grid?'grid':'flex';$('rows').style.flexDirection='column';$('rows').style.gridTemplateColumns=grid?'repeat(4,minmax(0,1fr))':'none';$('rows').style.gridTemplateRows=grid?'repeat(2,minmax(0,1fr))':'none';$('rows').innerHTML=menus[view].map((x,i)=>'<div class="row '+(i===1?'selected':'')+'" style="'+(grid?'':'flex-direction:row;justify-content:flex-start;text-align:left;height:48px;min-height:48px;gap:14px;padding:0 12px')+'"><span class="glyph" style="'+(grid?'':'font-size:20px;width:26px')+'">'+x[0]+'</span><span class="label">'+x[1]+'</span></div>').join('')}
function apply(){let mode=$('wall').value,screen=$('screen');screen.classList.toggle('no-wall',mode==='black');screen.classList.toggle('animated',mode==='image'&&$('animation').checked);$('screen').querySelector('.wallpaper').style.display=mode==='black'?'none':'block';$('screen').querySelector('.wallpaper').style.animation=mode==='still'||!$('animation').checked?'none':''}
['wall','layout','view','animation'].forEach(id=>$(id).addEventListener('change',()=>{draw();apply()}));draw();apply();
</script></body></html>
