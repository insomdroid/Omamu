name: Build muOS theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omamu-theme-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-theme:
    name: Validate and package Omamu
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Add licensed JetBrains Mono font
        run: |
          mkdir -p 640x480/font
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/JetBrains/JetBrainsMono/v2.304/fonts/ttf/JetBrainsMono-Regular.ttf \
            --output 640x480/font/default.ttf
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/JetBrains/JetBrainsMono/v2.304/OFL.txt \
            --output 640x480/font/OFL.txt
          test -s 640x480/font/default.ttf
          test -s 640x480/font/OFL.txt

      - name: Validate and build .muxthm
        run: python scripts/build_theme.py

      - name: Upload theme package
        uses: actions/upload-artifact@v4
        with:
          name: omamu-muxthm
          path: dist/Omamu.muxthm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

